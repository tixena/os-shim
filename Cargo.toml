[package]
name = "os-shim"
version = "0.1.2"
edition = "2024"
authors = ["Eduardo Burgos <eduardo@tixena.com>"]
description = "Mockable abstraction over the environment, filesystem, processes, zip archives and S3-compatible buckets, with in-memory twins for tests"
license = "MIT"
repository = "https://github.com/tixena/os-shim"
keywords = ["testing", "mock", "filesystem", "abstraction"]
categories = ["development-tools::testing", "filesystem"]
readme = "README.md"
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[dependencies]
# Real filesystem implementation
tempfile = "3.7.0"
ignore = "0.4.17"
same-file = "1.0.6"

# Mock implementation logging
tracing = "0.1.44"

# Zip archive streaming (optional)
zip = { version = "9.0.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
    "time",
], optional = true }
time = { version = "0.3.47", optional = true }

# Process operations (optional)
libc = { version = "0.2.183", optional = true }

# Bucket clients (optional): BlockingBucket's runtime
tokio = { version = "1.51.6", features = ["rt"], optional = true }

# Bucket clients (optional): AWS's S3 SDK, for MinIO-compatible servers and for AWS S3
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
], optional = true }

[dev-dependencies]
tokio = { version = "1.51.6", features = ["rt", "macros", "test-util"] }

[features]
default = []
async = ["dep:tokio", "tokio/time"]
minio = ["dep:tokio", "dep:aws-sdk-s3"]
process = ["libc"]
s3 = ["dep:tokio", "dep:aws-sdk-s3"]
zip = ["dep:zip", "dep:time"]

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
# Default trait methods (Drop::pin_drop) cannot be implemented on the beta channel.
missing_trait_methods = "allow"
pub_with_shorthand = "allow"
module_name_repetitions = "allow"
question_mark_used = "allow"
self_named_module_files = "allow"
separated_literal_suffix = "allow"
single_call_fn = "allow"
print_stderr = "allow"

[lints.rust]
# `slow_tests` gates the opt-in expensive tests; `just test-slow` sets it.
# `minio_tests` gates the tests against a MinIO-compatible server; `just test-minio` sets it.
# `s3_tests` gates the tests against an AWS bucket; `just test-s3` sets it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(slow_tests)", "cfg(minio_tests)", "cfg(s3_tests)"] }
